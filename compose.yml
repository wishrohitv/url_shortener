version: "3.8"

services:
  mongo:
    image: mongo

    ports:
      - 27027:27027

    enironment:
    - MONGO_INITDB_ROOT_USERNAME=admin
      MONGO_INITDB_ROOT_USERNAME:1234
    volumes:
      -v /home/wishrohitv/desktop/data:/data/db

    mongo-express:
      image: mongo-express
      ports:
      - 8081:8081

      environment:
        ME_CONFIG_MONGODB_ADMINUSERNAME: admin
        ME_CONFIG_MONGODB_ADMINPASSWORD: 3333
        ME_CONFIG_MONGODB_URL: mongodb://admin:1234@mongo:27017/
